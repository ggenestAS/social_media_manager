<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Albert Prep — Press reel #001 · Le Monde</title>
<style>
:root {
  --ink:#090a0b; --ink-2:#111316; --fog:#e6e8ec; --soft:#a2a8b1; --mute:#8b919a;
  --paper:#f4f2ec; --paper-ink:#111111; --paper-mute:#666666;
  --light-soft:#4d525a; --light-mute:#6b7078;
  --accent:hsl(210,60%,72%); --live:hsl(150,60%,55%);
  --hair:rgba(255,255,255,0.12); --hair-soft:rgba(255,255,255,0.08);
  --font:Helvetica,Arial,sans-serif; --serif:Georgia,'Times New Roman',serif;
}
*, *::before, *::after { box-sizing:border-box; }
html, body { margin:0; }
body { background:#1a1c1f; font-family:var(--font); color:var(--fog);
  -webkit-font-smoothing:antialiased; display:flex; flex-wrap:wrap; gap:64px;
  padding:64px; align-items:flex-start; }
h1, h2, h3, p { margin:0; }

/* Artboards — one .board per [data-screen-label], explicit inline width/height */
.board { position:relative; overflow:hidden; flex:none; display:flex;
  flex-direction:column; justify-content:space-between; font-family:var(--font); }
.board--ink { background:var(--ink); color:var(--fog); }
.board--light { background:var(--fog); color:var(--ink); }
.board--feed { padding:96px; }                 /* 1080×1350 */
.board--story { padding:270px 160px 480px 96px; } /* 1080×1920 — 9:16 SAFE ZONE: top 250, bottom 480, right 160 (Reels/Stories/TikTok UI) */

/* Statement type */
.eyebrow { font-size:30px; letter-spacing:0.18em; text-transform:uppercase; color:var(--mute); }
.board--light .eyebrow { color:var(--light-mute); }
.display { font-weight:500; letter-spacing:-0.035em; line-height:0.98; text-wrap:balance; }
.board--feed .display { font-size:132px; max-width:10ch; }
.board--story .display { font-size:136px; max-width:10ch; }
.display .dim { color:var(--mute); }
.display--stack { display:flex; flex-direction:column; gap:0.1em; }
.sub { margin-top:56px; font-size:40px; line-height:1.35; color:var(--soft); max-width:24ch; text-wrap:pretty; }
.board--story .sub { margin-top:56px; font-size:40px; max-width:22ch; }
.board--light .sub { color:var(--light-soft); }
.cursor { display:inline-block; width:8px; height:0.85em; margin-left:0.06em;
  vertical-align:-0.08em; background:var(--accent); }

/* Footer: wordmark left, trust line right */
.foot { display:flex; justify-content:space-between; align-items:center; }
.wordmark { display:flex; align-items:center; gap:16px; font-size:32px; white-space:nowrap; }
.wordmark strong { font-weight:600; }
.dots { display:inline-grid; grid-template-columns:repeat(3,8px); gap:6px; }
.dots span { width:8px; height:8px; border-radius:50%; background:currentColor; }
.trust { font-size:28px; color:var(--mute); }
.board--light .trust { color:var(--light-mute); }

/* Buttons */
.btn { display:inline-flex; align-items:center; gap:18px; padding:24px 40px;
  border-radius:16px; background:var(--fog); color:var(--ink); font-size:34px; font-weight:600; }
.board--light .btn { background:var(--ink); color:var(--fog); }

/* Press split: paper (headline) on top, ink (Albert) below */
.split { padding:0; }
.split .paper { flex:1; background:var(--paper); color:var(--paper-ink); padding:88px 96px;
  display:flex; flex-direction:column; justify-content:space-between; }
.split .ink { flex:1; background:var(--ink); color:var(--fog); padding:88px 96px;
  display:flex; flex-direction:column; justify-content:space-between; }
.board--story.split .paper { padding:290px 160px 96px 96px; }
.board--story.split .ink { padding:80px 160px 480px 96px; }
.masthead { display:flex; justify-content:space-between; align-items:center; height:72px; }
.masthead .mast { font-family:var(--serif); font-weight:700; font-size:48px; letter-spacing:0.04em; }
.masthead img { height:64px; width:auto; }
.masthead .date { font-size:26px; color:var(--paper-mute); }
.headline { font-family:var(--serif); font-weight:700; font-size:66px;
  letter-spacing:-0.025em; line-height:1.08; text-wrap:balance; }
.board--story .headline { font-size:74px; }
.kicker { font-size:28px; letter-spacing:0.18em; text-transform:uppercase; color:var(--mute); line-height:1.3; }
.reply { margin-top:32px; font-size:82px; font-weight:500; letter-spacing:-0.035em; line-height:1.0; text-wrap:balance; }
.board--story .reply { font-size:84px; }
.why { margin-top:32px; font-size:34px; line-height:1.4; color:var(--soft); max-width:28ch; }

/* Carousel: clipping stack + plan card */
.clips { display:flex; flex-direction:column; gap:20px; transform:rotate(-2deg); margin:-20px -40px 0; }
.clip { background:var(--paper); color:var(--paper-ink); padding:28px 34px; border-radius:6px; }
.clip .src { font-size:20px; letter-spacing:0.1em; text-transform:uppercase; color:var(--paper-mute);
  display:flex; justify-content:space-between; }
.clip p { margin-top:10px; font-size:38px; font-weight:600; letter-spacing:-0.02em; line-height:1.1; font-family:var(--serif); }
.card-h1 { font-size:124px; font-weight:500; letter-spacing:-0.035em; line-height:0.98; max-width:11ch; text-wrap:balance; }
.card-h2 { font-size:88px; font-weight:500; letter-spacing:-0.035em; line-height:1.0; max-width:14ch; text-wrap:balance; }
.card-h3 { font-size:96px; font-weight:500; letter-spacing:-0.035em; line-height:1.0; text-wrap:balance; }
.card-hook { font-size:120px; font-weight:500; letter-spacing:-0.035em; line-height:0.98; }
.card-sub { margin-top:40px; font-size:34px; line-height:1.4; color:var(--soft); max-width:30ch; text-wrap:pretty; }
.card-sub--big { margin-top:56px; font-size:40px; line-height:1.35; max-width:24ch; }
.count { font-size:28px; color:var(--mute); white-space:nowrap; }
.board--light .count { color:var(--light-mute); }
.plan { padding:44px; border:1px solid var(--hair); border-radius:28px;
  background:linear-gradient(180deg,rgba(255,255,255,0.05),rgba(255,255,255,0.01)); }
.plan .label { display:flex; justify-content:space-between; font-size:22px; letter-spacing:0.14em;
  text-transform:uppercase; color:var(--mute); }
.plan .live { display:inline-flex; align-items:center; gap:8px; }
.plan .live::before { content:''; width:10px; height:10px; border-radius:50%; background:var(--live); }
.plan .title { margin-top:24px; font-size:52px; font-weight:500; letter-spacing:-0.03em; line-height:1.05; }
.plan .meta { margin-top:12px; font-size:26px; color:var(--soft); }
.plan .weeks { margin-top:32px; display:grid; grid-template-columns:repeat(9,1fr); gap:6px; }
.plan .weeks span { height:10px; border-radius:5px; background:rgba(255,255,255,0.18); }
.plan .weeks span.done { background:var(--accent); }
.plan .weeks span.next { background:rgba(255,255,255,0.35); }
.plan .phases { margin-top:28px; display:grid; grid-template-columns:repeat(4,1fr); gap:16px; font-size:24px; }
.plan .phases span { display:flex; flex-direction:column; gap:6px; }
.plan .phases span > span:first-child { color:var(--mute); }

/* Press reel (9:16, animated — see post-types/press-reel) */
.reel { width:1080px; height:1920px; background:var(--ink); color:var(--fog); }
.reel .zoom { position:absolute; inset:0; transform-origin:50% 45%; }
.reel .paper { position:absolute; left:0; top:0; width:1080px; height:1920px; background:var(--paper);
  color:var(--paper-ink); padding:290px 185px 560px 96px; display:flex; flex-direction:column;
  justify-content:space-between; overflow:hidden; }
.reel .paper .headline { font-size:104px; line-height:1.06; }
.reel .panel { position:absolute; left:0; top:1920px; width:1080px; height:1120px; background:var(--ink);
  padding:72px 170px 504px 96px; display:flex; flex-direction:column; justify-content:space-between;
  box-shadow:0 -40px 120px rgba(0,0,0,0.6); }  /* rises to y=800; bottom padding clears the 480px caption layer */
/* .reel .paper padding-bottom is animated by reel-timeline.js (560px → 80px as the panel rises) so the headline
   never sits in the caption band; the extra top/right paper margin absorbs the 5% camera zoom. */
.reel .right-line { display:flex; flex-wrap:wrap; align-items:baseline; gap:0 0.3em; font-weight:500;
  line-height:1.15; min-height:32px; letter-spacing:-0.035em; color:var(--fog); }
.reel .right-line > span { display:inline-block; }
.reel .hero { margin-top:44px; font-size:86px; font-weight:500; letter-spacing:-0.035em; line-height:1.0; }
.reel .word { display:inline-block; margin-right:0.24em; white-space:pre; }
.reel .hero .cursor { width:8px; height:0.82em; vertical-align:-0.08em; opacity:0; }
.reel .cta-wrap { transform-origin:left center; }
.reel .btn { padding:20px 36px; border-radius:16px; font-size:32px; }
.reel .btn .arrow { font-size:42px; line-height:1; }
.reel .seam { position:absolute; inset:0; background:var(--ink); pointer-events:none; }
</style>
</head>
<body>
<div data-screen-label="Press reel · Le Monde · 9:16" class="board reel" style="width:1080px;height:1920px" data-speed="1">
  <script type="application/json" class="reel-config">{
  "scenes": [
    3.8,
    2.2,
    4,
    3.2
  ],
  "mast": "Le Monde",
  "date": "18 septembre 2026",
  "headline": "Les avancées de l’IA provoquent une crise inédite chez les mathématiciens",
  "headSize": 92,
  "headSizeSmall": 64,
  "right": "L’IA fait les maths.",
  "rightSize": 150,
  "kicker": "Toi, tu passes le bac.",
  "hero": "Le jour J, tu es le seul modèle dans la salle.",
  "heroSize": 96,
  "accentFrom": 5,
  "cta": "Construire mon plan",
  "foot": "Gratuit · accès anticipé · sans carte",
  "accent": "#9ec0ea"
}</script>
  <div class="zoom">
    <div class="paper">
      <div class="masthead"><span class="mast"></span><span class="date"></span></div>
      <p class="headline"></p>
    </div>
    <div class="panel">
      <div>
        <div class="right-line"><span class="right"></span><span class="kicker-txt"></span></div>
        <h1 class="hero"><span class="words"></span><span class="cursor"></span></h1>
      </div>
      <div class="cta-wrap"><span class="btn"><span class="cta-txt"></span><span class="arrow">↑</span></span></div>
      <div class="foot"><div class="wordmark"><span class="dots"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></span><span><strong>Albert</strong> Prep</span></div><span class="trust"></span></div>
    </div>
  </div>
  <div class="seam"></div>
</div>
<script>
/**
 * Press reel timeline — inlined by every press-reel source.html.
 *
 * Port of the Claude Design composition (meta-reel-1.jsx on animations-v3, safe-zone
 * revision: SAFE = top 250 / bottom 480 / right 160, panel at y=800) to
 * CSS keyframes so the repo's exporter can seek the timeline frame by frame.
 * Every animation shares one duration (the authored loop) and encodes its
 * timing as keyframe percentages; the exporter sets `currentTime` on each.
 *
 * For each `.reel[data-screen-label]` it reads the JSON in
 * `script.reel-config`, fills the copy into the DOM, generates keyframes and
 * writes data-loop-ms / data-cta-ms / data-cover-ms for html-to-mp4.
 */
(function initPressReels() {
  const EASE = {
    outCubic: 'cubic-bezier(0.33,1,0.68,1)',
    outExpo: 'cubic-bezier(0.16,1,0.3,1)',
    outBack: 'cubic-bezier(0.34,1.56,0.64,1)',
    inOutCubic: 'cubic-bezier(0.65,0,0.35,1)',
    linear: 'linear',
    step: 'step-end',
  };
  const H = 1920;
  const PANEL_Y = 800; // ink panel top once risen — keeps the hero + CTA above the 480px caption layer
  const FOG = '#e6e8ec';
  const MUTE = '#8b919a';

  const hexToRgb = (hex) => {
    const h = String(hex).replace('#', '');
    const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h;
    const n = parseInt(x.slice(0, 6), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(',');
  };

  document.querySelectorAll('.reel[data-screen-label]').forEach((reel, idx) => {
    const cfgEl = reel.querySelector('script.reel-config');
    if (!cfgEl) return;
    const R = Object.assign(
      {
        scenes: [3.8, 2.2, 3.8, 3.2],
        mast: 'FORTUNE', mastSpacing: '0.04em', logo: null, date: '',
        headline: '', headSize: 104, headSizeSmall: 72,
        right: '', rightSize: 176, kicker: '',
        hero: '', heroSize: 100, accentFrom: null,
        cta: 'Build my plan', foot: 'Free · early access · no card', accent: '#9ec0ea',
      },
      JSON.parse(cfgEl.textContent)
    );

    const [dHead, dRight, dTurn, dCta] = R.scenes;
    const RIGHT = dHead;
    const TURN = RIGHT + dRight;
    const CTA = TURN + dTurn;
    const TOTAL = CTA + dCta;
    const rgb = hexToRgb(R.accent);

    const id = 'pr' + idx;
    const rules = [];
    let n = 0;
    const pct = (s) => ((Math.min(Math.max(s, 0), TOTAL) / TOTAL) * 100).toFixed(3) + '%';

    // stops: [[seconds, 'css declarations', easeKeyForNextSegment?], …]
    const kf = (name, stops) => {
      const nm = `${id}_${name}_${n++}`;
      const body = stops
        .map(([s, css, e]) => `${pct(s)}{${css}${e ? ';animation-timing-function:' + EASE[e] : ''}}`)
        .join('');
      rules.push(`@keyframes ${nm}{${body}}`);
      return `${nm} ${TOTAL}s linear infinite both`;
    };
    const set = (el, ...anims) => {
      if (el) el.style.animation = anims.filter(Boolean).join(', ');
    };

    // MOTION.pop — opacity reaches 1 in the first third, scale 0.6→1 with overshoot
    const pop = (s, d) => kf('pop', [
      [0, 'opacity:0;transform:scale(0.6)'],
      [s, 'opacity:0;transform:scale(0.6)', 'outBack'],
      [s + d / 3, 'opacity:1'],
      [s + d, 'opacity:1;transform:scale(1)'],
      [TOTAL, 'opacity:1;transform:scale(1)'],
    ]);
    // MOTION.enter — rise 48px + fade
    const enter = (s, d) => kf('enter', [
      [0, 'opacity:0;transform:translateY(48px)'],
      [s, 'opacity:0;transform:translateY(48px)', 'outCubic'],
      [s + d, 'opacity:1;transform:none'],
      [TOTAL, 'opacity:1;transform:none'],
    ]);
    const words = (el, text, start, stagger, d, accentFrom, accentAt) => {
      el.innerHTML = '';
      text.split(' ').forEach((w, i) => {
        const span = document.createElement('span');
        span.className = 'word';
        span.textContent = w;
        const anims = [pop(start + i * stagger, d)];
        if (accentFrom != null && i >= accentFrom) {
          anims.push(kf('accent', [
            [0, `color:${FOG};text-shadow:0 0 0 rgba(${rgb},0)`],
            [accentAt, `color:${FOG};text-shadow:0 0 0 rgba(${rgb},0)`, 'linear'],
            [accentAt + 0.35, `color:${R.accent};text-shadow:0 0 24px rgba(${rgb},0.4)`],
            [TOTAL, `color:${R.accent};text-shadow:0 0 24px rgba(${rgb},0.4)`],
          ]));
        }
        set(span, ...anims);
        el.appendChild(span);
      });
    };

    // ── DOM fill ─────────────────────────────────────────────────────────
    const q = (sel) => reel.querySelector(sel);
    const mast = q('.mast');
    if (R.logo && R.showLogo) {
      const img = document.createElement('img');
      img.src = R.logo; img.alt = R.mast; img.className = 'mast-logo';
      mast.replaceWith(img);
    } else {
      mast.textContent = R.mast;
      mast.style.letterSpacing = R.mastSpacing;
    }
    q('.date').textContent = R.date;
    q('.right').textContent = R.right;
    q('.kicker-txt').textContent = R.kicker;
    q('.cta-txt').textContent = R.cta;
    q('.trust').textContent = R.foot;
    q('.hero').style.fontSize = Math.round(R.heroSize * 0.86) + 'px';

    // ── Choreography (authored seconds) ──────────────────────────────────
    const zoom = q('.zoom');
    set(zoom, kf('zoom', [
      [0, 'transform:scale(1)', 'linear'],
      [RIGHT, 'transform:scale(1.05)', 'linear'],
      [RIGHT + 0.6, 'transform:scale(1)', 'linear'],
      [TURN, 'transform:scale(1)', 'linear'],
      [TOTAL, 'transform:scale(1.02)'],
    ]));

    const paper = q('.paper');
    set(paper,
      kf('wipe', [
        [0, 'clip-path:inset(0 0 100% 0)'],
        [0.1, 'clip-path:inset(0 0 100% 0)', 'outExpo'],
        [0.8, 'clip-path:inset(0 0 0% 0)'],
        [TOTAL, 'clip-path:inset(0 0 0% 0)'],
      ]),
      // height follows the panel; bottom padding shrinks with it so the headline stays
      // above the 480px caption band while the paper is full-height (SAFE.bottom + 80)
      kf('paperH', [
        [0, `height:${H}px;padding-bottom:560px`],
        [RIGHT, `height:${H}px;padding-bottom:560px`, 'outExpo'],
        [RIGHT + 0.55, `height:${PANEL_Y}px;padding-bottom:80px`],
        [TOTAL, `height:${PANEL_Y}px;padding-bottom:80px`],
      ])
    );
    set(q('.mast, .mast-logo'), pop(0.45, 0.7));
    set(q('.date'), enter(0.7, 0.5));

    const headline = q('.headline');
    words(headline, R.headline, 0.95, 0.12, 0.5, null, null);
    set(headline, kf('hsize', [
      [0, `font-size:${R.headSize}px`],
      [RIGHT, `font-size:${R.headSize}px`, 'outExpo'],
      [RIGHT + 0.55, `font-size:${Math.round(R.headSizeSmall * 0.82)}px`],
      [TOTAL, `font-size:${Math.round(R.headSizeSmall * 0.82)}px`],
    ]));

    set(q('.panel'), kf('panel', [
      [0, `top:${H}px`],
      [RIGHT, `top:${H}px`, 'outExpo'],
      [RIGHT + 0.55, `top:${PANEL_Y}px`],
      [TOTAL, `top:${PANEL_Y}px`],
    ]));

    // "They're right." — big at Right, shrinks to a kicker at Turn
    const rightPx = Math.round(R.rightSize * 0.85);
    set(q('.right-line'), kf('shrink', [
      [0, `font-size:${rightPx}px;letter-spacing:-0.035em;color:${FOG};text-transform:none`],
      [TURN, `font-size:${rightPx}px;letter-spacing:-0.035em;color:${FOG};text-transform:none`, 'inOutCubic'],
      [TURN + 0.3, `color:${FOG};text-transform:none`, 'linear'],
      [TURN + 0.4, `color:${MUTE};text-transform:uppercase`, 'linear'],
      [TURN + 0.7, `font-size:26px;letter-spacing:0.18em;color:${MUTE};text-transform:uppercase`],
      [TOTAL, `font-size:26px;letter-spacing:0.18em;color:${MUTE};text-transform:uppercase`],
    ]));
    set(q('.right'), pop(RIGHT + 0.45, 0.6));
    set(q('.kicker-txt'), enter(TURN + 0.5, 0.5));

    // Hero line + cursor + lift
    const heroStart = TURN + 0.9;
    words(q('.hero .words'), R.hero, heroStart, 0.14, 0.5, R.accentFrom, heroStart + 1.9);
    set(q('.hero'), kf('lift', [
      [0, 'transform:translateY(0)'],
      [CTA, 'transform:translateY(0)', 'outCubic'],
      [CTA + 0.6, 'transform:translateY(-12px)'],
      [TOTAL, 'transform:translateY(-12px)'],
    ]));
    const cursor = q('.hero .cursor');
    cursor.style.background = R.accent;
    {
      const from = heroStart + 1.6;
      const f = 2.2;
      const stops = [[0, 'opacity:0', 'step']];
      let k = Math.floor(from * f);
      let cur = k % 2 === 0 ? 1 : 0.15;
      stops.push([from, `opacity:${cur}`, 'step']);
      k += 1;
      while (k / f < TOTAL) {
        cur = k % 2 === 0 ? 1 : 0.15;
        stops.push([k / f, `opacity:${cur}`, 'step']);
        k += 1;
      }
      stops.push([TOTAL, `opacity:${cur}`]);
      set(cursor, kf('blink', stops));
    }

    set(q('.cta-wrap'), pop(CTA + 0.15, 0.6));
    set(q('.foot'), enter(CTA + 0.55, 0.6));

    // loop seam — black in/out
    set(q('.seam'), kf('seam', [
      [0, 'opacity:1', 'linear'],
      [0.15, 'opacity:0', 'linear'],
      [TOTAL - 0.4, 'opacity:0', 'linear'],
      [TOTAL, 'opacity:1'],
    ]));

    // ── Sound design cues (authored seconds) — mixed by tools/html-to-mp4.mjs ──
    // Samples live in brands/<brand>/assets/audio/<sample>.wav (see assets/audio/SOURCES.md).
    // Every beat of the choreography gets one hit; the bed is generated (pink room tone).
    if (R.audio !== false) {
      const cues = [];
      const cue = (at, sample, gain = 1) => cues.push({ at: +at.toFixed(3), sample, gain });
      cue(0.1, 'paper-slide', 0.8);                                  // paper wipes down
      cue(0.45, 'click-soft', 0.5);                                  // masthead pops
      R.headline.split(' ').forEach((_, i) => cue(0.95 + i * 0.12, `key-${(i % 3) + 1}`, 0.7)); // headline types
      cue(RIGHT, 'slam', 1);                                         // ink panel slams up
      cue(RIGHT + 0.45, 'pop', 0.8);                                 // the reply punches in
      cue(TURN + 0.5, 'click-soft', 0.5);                            // kicker enters
      R.hero.split(' ').forEach((_, i) => cue(heroStart + i * 0.14, 'key-soft', 0.55)); // hero line builds
      cue(heroStart + 1.9, 'chime', 0.7);                            // accent words turn blue
      cue(CTA + 0.15, 'pop', 0.9);                                   // button pops
      cue(CTA + 0.55, 'click-soft', 0.4);                            // footer settles
      reel.dataset.audioCues = JSON.stringify(cues);
      reel.dataset.audioBed = R.bed || 'pink:0.035';                 // type:volume — the low room tone under everything
    }

    // ── Export hints for tools/html-to-mp4.mjs ───────────────────────────
    reel.dataset.loopMs = String(Math.round(TOTAL * 1000));
    reel.dataset.ctaMs = String(Math.round((CTA + 1.6) * 1000));
    reel.dataset.coverMs = String(Math.round((RIGHT - 0.2) * 1000));
    if (!reel.dataset.speed) reel.dataset.speed = '1';

    const style = document.createElement('style');
    style.id = `${id}-timeline`;
    style.textContent = rules.join('\n');
    document.head.appendChild(style);
  });
})();
</script>
</body>
</html>
